# Deadline Bot: self-hosted n8n with a Postgres database.
#
#   cp .env.example .env      # then fill in your own values
#   docker compose up -d
#   open http://localhost:5678
#
# On the first start, the five workflows in ./n8n are imported automatically.

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
  TZ: ${TZ:-Europe/Paris}
  WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once, before n8n starts: imports the workflows from ./n8n the first time only.
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:2.44.5
    environment: *n8n-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /home/node/.n8n/.workflows-imported ]; then
          echo "Workflows already imported, skipping."
        else
          n8n import:workflow --separate --input=/workflows && touch /home/node/.n8n/.workflows-imported
        fi
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.5
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  n8n_data:
